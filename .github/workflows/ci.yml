name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: combolo
          POSTGRES_PASSWORD: combolo
          POSTGRES_DB: combolo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U combolo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://combolo:combolo@localhost:5432/combolo_test
      TEST_DATABASE_URL: postgresql://combolo:combolo@localhost:5432/combolo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
